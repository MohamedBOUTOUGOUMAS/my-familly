<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arbre généalogique — Famille Boutgoumas</title>
<style>
  :root{
    --paper:#f4ecdd;
    --paper-dark:#e8dcc4;
    --ink:#2c2418;
    --ink-soft:#5c5140;
    --line:#8a7a5c;
    --accent:#a8432f;
    --card-shadow: 0 2px 6px rgba(44,36,24,0.25);

    --c0:#d9a877; --c0-ink:#3a2a15;
    --c1:#3f6690; --c1-ink:#eef3f8;
    --c2:#748f3c; --c2-ink:#f4f7ec;
    --c3:#cdb92e; --c3-ink:#2c2610;
    --c4:#c68a2e; --c4-ink:#2c1e08;
    --c5:#28324d; --c5-ink:#e9ecf4;
    --c6:#8f3b3b; --c6-ink:#f6e9e9;
    --c7:#5c5140; --c7-ink:#f4f1ea;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family: 'Georgia', 'Iowan Old Style', serif;
    background:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.4), transparent 60%),
      var(--paper);
    color:var(--ink);
    overflow:hidden;
  }

  header{
    position:fixed; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:baseline; gap:14px;
    padding:14px 20px 10px;
    background:linear-gradient(to bottom, var(--paper) 75%, transparent);
    pointer-events:none;
  }
  header *{pointer-events:auto;}
  h1{
    font-size:1.35rem; margin:0; letter-spacing:0.5px;
    font-weight:700; color:var(--ink);
  }
  header .sub{
    font-size:0.8rem; color:var(--ink-soft); font-style:italic;
  }

  #toolbar{
    position:fixed; top:14px; right:18px; z-index:30;
    display:flex; gap:8px; align-items:center;
  }
  #toolbar input[type="text"]{
    font-family:inherit; font-size:0.85rem;
    padding:7px 10px; border-radius:6px;
    border:1px solid var(--line); background:#fffdf8;
    width:150px; color:var(--ink);
  }
  .btn{
    font-family:inherit; font-size:0.85rem; cursor:pointer;
    padding:7px 11px; border-radius:6px;
    border:1px solid var(--line); background:#fffdf8; color:var(--ink);
    transition:background .15s;
  }
  .btn:hover{background:var(--paper-dark);}
  .btn:active{transform:translateY(1px);}

  #canvas-wrap{
    position:absolute; inset:0;
    cursor:grab;
  }
  #canvas-wrap.dragging{cursor:grabbing;}

  svg#tree{ display:block; }

  .node-card{
    filter:drop-shadow(0 2px 3px rgba(44,36,24,0.3));
    cursor:pointer;
  }
  .node-card rect{
    stroke:rgba(0,0,0,0.25); stroke-width:1;
  }
  .node-card.dim{ opacity:0.22; }
  .node-card.match rect{ stroke:var(--accent); stroke-width:3; }

  .node-name{
    font-weight:700; font-size:12.5px; pointer-events:none;
  }
  .node-dates{
    font-size:10.5px; opacity:0.85; pointer-events:none;
  }
  .node-flag{
    font-size:10px; pointer-events:none;
  }

  .link{
    fill:none; stroke:var(--line); stroke-width:1.4; opacity:0.75;
  }
  .link.dim{ opacity:0.12; }

  #legend{
    position:fixed; left:16px; bottom:16px; z-index:20;
    background:rgba(255,253,248,0.92); border:1px solid var(--line);
    border-radius:8px; padding:10px 12px; font-size:0.72rem;
    max-width:150px; box-shadow: var(--card-shadow);
  }
  #legend .row{display:flex; align-items:center; gap:6px; margin:3px 0;}
  #legend .swatch{width:12px; height:12px; border-radius:3px; flex:none;}
  #legend h4{margin:0 0 6px; font-size:0.72rem; letter-spacing:0.3px; color:var(--ink-soft);}

  #panel{
    position:fixed; top:0; right:0; bottom:0; z-index:40;
    width:300px; max-width:86vw;
    background:#fffdf8; border-left:1px solid var(--line);
    box-shadow:-4px 0 16px rgba(0,0,0,0.15);
    transform:translateX(100%); transition:transform .25s ease;
    padding:22px 20px; overflow-y:auto;
  }
  #panel.open{ transform:translateX(0); }
  #panel .close{
    position:absolute; top:12px; right:14px; cursor:pointer;
    font-size:1.1rem; color:var(--ink-soft); background:none; border:none;
  }
  #panel h2{ margin:0 0 4px; font-size:1.2rem; }
  #panel .pdates{ color:var(--ink-soft); font-style:italic; margin-bottom:14px; }
  #panel dl{ margin:0; }
  #panel dt{ font-size:0.72rem; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-soft); margin-top:12px; }
  #panel dd{ margin:3px 0 0; line-height:1.4; }
  #panel dd.incertain{ color:var(--accent); font-style:italic; }
  #panel .childcount{ margin-top:16px; font-size:0.8rem; color:var(--ink-soft); }

  #hint{
    position:fixed; bottom:16px; right:18px; z-index:20;
    font-size:0.72rem; color:var(--ink-soft); font-style:italic;
    background:rgba(255,253,248,0.85); padding:6px 10px; border-radius:6px;
  }

  @media (max-width:640px){
    header{padding:10px 12px 8px;}
    h1{font-size:1.05rem;}
    header .sub{display:none;}
    #toolbar{top:auto; bottom:16px; left:16px; right:auto; flex-wrap:wrap; max-width:70vw;}
    #toolbar input[type="text"]{width:110px;}
    #legend{display:none;}
    #hint{display:none;}
  }
</style>
</head>
<body>

<header>
  <h1>Famille Boutgoumas <span style="color:var(--ink-soft); font-weight:400;">/ Boutoughmas</span></h1>
  <span class="sub">Panneau N°95 — État civil 1890</span>
</header>

<div id="toolbar">
  <input type="text" id="search" placeholder="Rechercher un nom…">
  <button class="btn" id="zoomIn" title="Zoom avant">+</button>
  <button class="btn" id="zoomOut" title="Zoom arrière">−</button>
  <button class="btn" id="reset" title="Réinitialiser la vue">⤾ Vue</button>
</div>

<div id="canvas-wrap">
  <svg id="tree" xmlns="http://www.w3.org/2000/svg">
    <g id="viewport">
      <g id="links"></g>
      <g id="nodes"></g>
    </g>
  </svg>
</div>

<div id="legend">
  <h4>Générations</h4>
  <div id="legend-rows"></div>
</div>

<div id="hint">Molette = zoom · glisser = déplacer · clic sur une carte = détails</div>

<div id="panel">
  <button class="close" id="panelClose">✕</button>
  <h2 id="pName"></h2>
  <div class="pdates" id="pDates"></div>
  <dl id="pFields"></dl>
  <div class="childcount" id="pChildren"></div>

/* ---------- Palette par génération ---------- */
const PALETTE = [
  {fill:'var(--c0)', ink:'var(--c0-ink)', label:'Fondateur'},
  {fill:'var(--c1)', ink:'var(--c1-ink)', label:'Génération 1'},
  {fill:'var(--c2)', ink:'var(--c2-ink)', label:'Génération 2'},
  {fill:'var(--c3)', ink:'var(--c3-ink)', label:'Génération 3'},
  {fill:'var(--c4)', ink:'var(--c4-ink)', label:'Génération 4'},
  {fill:'var(--c5)', ink:'var(--c5-ink)', label:'Génération 5'},
  {fill:'var(--c6)', ink:'var(--c6-ink)', label:'Génération 6'},
  {fill:'var(--c7)', ink:'var(--c7-ink)', label:'Génération 7'}
];

/* ---------- Layout ---------- */
const NODE_W = 128, NODE_H = 58, H_GAP = 26, V_GAP = 90;
let uid = 0;
let cursorX = 0;

function layout(node, depth){
  node._id = 'n' + (uid++);
  node._depth = depth;
  node._children = node.enfants || [];
  if(node._children.length === 0){
    node._x = cursorX + NODE_W/2;
    cursorX += NODE_W + H_GAP;
  } else {
    node._children.forEach(c => layout(c, depth+1));
    const first = node._children[0], last = node._children[node._children.length-1];
    node._x = (first._x + last._x) / 2;
  }
  node._y = depth * V_GAP + 40;
}

layout(DATA.racine, 0);
const totalWidth = cursorX + 40;
let maxDepth = 0;
(function findMaxDepth(n){ maxDepth = Math.max(maxDepth, n._depth); (n._children||[]).forEach(findMaxDepth); })(DATA.racine);
const totalHeight = (maxDepth+1) * V_GAP + 100;

/* ---------- Rendu SVG ---------- */
const svg = document.getElementById('tree');
const viewport = document.getElementById('viewport');
const linksG = document.getElementById('links');
const nodesG = document.getElementById('nodes');
svg.setAttribute('width', totalWidth);
svg.setAttribute('height', totalHeight);

const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs){
  const e = document.createElementNS(NS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function wrapText(str, maxChars){
  const words = str.split(' ');
  const lines = [];
  let cur = '';
  for(const w of words){
    if((cur + ' ' + w).trim().length > maxChars){
      if(cur) lines.push(cur.trim());
      cur = w;
    } else {
      cur = (cur + ' ' + w).trim();
    }
  }
  if(cur) lines.push(cur.trim());
  return lines.slice(0,2);
}

function drawLink(parent, child){
  const x1 = parent._x, y1 = parent._y + NODE_H/2;
  const x2 = child._x, y2 = child._y - NODE_H/2;
  const midY = (y1 + y2) / 2;
  const d = `M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}`;
  const path = el('path', {d, class:'link', 'data-parent':parent._id, 'data-child':child._id});
  linksG.appendChild(path);
}

function drawNode(node){
  const pal = PALETTE[Math.min(node._depth, PALETTE.length-1)];
  const g = el('g', {
    class:'node-card',
    transform:`translate(${node._x - NODE_W/2}, ${node._y - NODE_H/2})`,
    'data-id': node._id,
    'data-name': node.nom.toLowerCase()
  });
  const rect = el('rect', {
    width:NODE_W, height:NODE_H, rx:10, ry:10,
    fill:pal.fill
  });
  g.appendChild(rect);

  const nameLines = wrapText(node.nom, 18);
  const dates = node.naissance_deces || [node.naissance, node.deces].filter(Boolean).join('/') || '';

  let ty = dates ? 20 : (nameLines.length > 1 ? 20 : 33);
  nameLines.forEach((line, i) => {
    const t = el('text', {x:NODE_W/2, y: (nameLines.length>1? 18 + i*14 : (dates?20:31)), 'text-anchor':'middle', class:'node-name', fill:pal.ink});
    t.textContent = line;
    g.appendChild(t);
  });
  if(dates){
    const dy = nameLines.length > 1 ? 46 : 38;
    const t2 = el('text', {x:NODE_W/2, y:dy, 'text-anchor':'middle', class:'node-dates', fill:pal.ink});
    t2.textContent = dates;
    g.appendChild(t2);
  }
  if(node.incertain){
    const flag = el('text', {x:NODE_W-8, y:14, 'text-anchor':'end', class:'node-flag', fill:pal.ink});
    flag.textContent = '❓';
    g.appendChild(flag);
  }

  g.addEventListener('click', () => openPanel(node));
  nodesG.appendChild(g);
}

function renderAll(node){
  (node._children||[]).forEach(c => { drawLink(node, c); renderAll(c); });
  drawNode(node);
}
renderAll(DATA.racine);

/* ---------- Légende ---------- */
const legendRows = document.getElementById('legend-rows');
for(let i=0; i<=maxDepth; i++){
  const pal = PALETTE[Math.min(i, PALETTE.length-1)];
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<span class="swatch" style="background:${getComputedColor(pal.fill)}"></span><span>${i===0? 'Fondateur' : 'Génération '+i}</span>`;
  legendRows.appendChild(row);
}
function getComputedColor(varName){
  const tmp = document.createElement('div');
  tmp.style.color = varName;
  document.body.appendChild(tmp);
  const c = getComputedStyle(tmp).color;
  document.body.removeChild(tmp);
  return c;
}

/* ---------- Panneau de détails ---------- */
const panel = document.getElementById('panel');
document.getElementById('panelClose').addEventListener('click', () => panel.classList.remove('open'));

function openPanel(node){
  document.getElementById('pName').textContent = node.nom;
  const dates = node.naissance_deces || [node.naissance, node.deces].filter(Boolean).join(' / ');
  document.getElementById('pDates').textContent = dates || '';

  const fields = document.getElementById('pFields');
  fields.innerHTML = '';
  function addField(label, value, cls){
    if(!value) return;
    const dt = document.createElement('dt'); dt.textContent = label;
    const dd = document.createElement('dd'); dd.textContent = value; if(cls) dd.className = cls;
    fields.appendChild(dt); fields.appendChild(dd);
  }
  addField('Mère', node.mere);
  if(node.epouses) addField('Épouses', node.epouses.join(' · '));
  addField('Époux / épouse', node.epoux);
  addField('Notes', node.notes);
  addField('À vérifier', node.incertain, 'incertain');

  const childCount = (node._children||[]).length;
  document.getElementById('pChildren').textContent =
    childCount > 0 ? `${childCount} enfant(s) répertorié(s)` : 'Aucun enfant répertorié sur le panneau';

  panel.classList.add('open');
}

/* ---------- Recherche ---------- */
const searchInput = document.getElementById('search');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  const cards = nodesG.querySelectorAll('.node-card');
  if(!q){
    cards.forEach(c => c.classList.remove('dim','match'));
    linksG.querySelectorAll('.link').forEach(l => l.classList.remove('dim'));
    return;
  }
  cards.forEach(c => {
    const match = c.getAttribute('data-name').includes(q);
    c.classList.toggle('match', match);
    c.classList.toggle('dim', !match);
  });
  linksG.querySelectorAll('.link').forEach(l => l.classList.add('dim'));
});

/* ---------- Zoom & pan ---------- */
let scale = 1, tx = 0, ty = 0;
const wrap = document.getElementById('canvas-wrap');

function applyTransform(){
  viewport.setAttribute('transform', `translate(${tx},${ty}) scale(${scale})`);
}

function fitToScreen(){
  const rect = wrap.getBoundingClientRect();
  const sx = rect.width / totalWidth;
  const sy = rect.height / totalHeight;
  scale = Math.min(sx, sy, 1) * 0.94;
  tx = (rect.width - totalWidth*scale) / 2;
  ty = 24;
  applyTransform();
}

function initialView(){
  fitToScreen();
  const rect = wrap.getBoundingClientRect();
  // Zoom initial plus rapproché, centré sur la racine (Boutgoumas) en haut de l'arbre
  const rootScreenX = tx + DATA.racine._x * scale;
  const rootScreenY = ty + DATA.racine._y * scale;
  zoomBy(2.4, rootScreenX, rootScreenY);
}

window.addEventListener('resize', fitToScreen);
initialView();

document.getElementById('zoomIn').addEventListener('click', () => { zoomBy(1.2); });
document.getElementById('zoomOut').addEventListener('click', () => { zoomBy(1/1.2); });
document.getElementById('reset').addEventListener('click', fitToScreen);

function zoomBy(factor, cx, cy){
  const rect = wrap.getBoundingClientRect();
  cx = cx ?? rect.width/2; cy = cy ?? rect.height/2;
  const newScale = Math.min(Math.max(scale*factor, 0.08), 4);
  tx = cx - (cx - tx) * (newScale/scale);
  ty = cy - (cy - ty) * (newScale/scale);
  scale = newScale;
  applyTransform();
}

wrap.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = wrap.getBoundingClientRect();
  const factor = e.deltaY < 0 ? 1.1 : 1/1.1;
  zoomBy(factor, e.clientX - rect.left, e.clientY - rect.top);
}, {passive:false});

let dragging = false, lastX, lastY;
wrap.addEventListener('mousedown', (e) => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  wrap.classList.add('dragging');
});
window.addEventListener('mousemove', (e) => {
  if(!dragging) return;
  tx += e.clientX - lastX; ty += e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  applyTransform();
});
window.addEventListener('mouseup', () => { dragging = false; wrap.classList.remove('dragging'); });

/* touch support */
let lastTouchDist = null, lastTouchMid = null;
wrap.addEventListener('touchstart', (e) => {
  if(e.touches.length === 1){
    dragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
  } else if(e.touches.length === 2){
    dragging = false;
    lastTouchDist = touchDist(e.touches);
    lastTouchMid = touchMid(e.touches);
  }
}, {passive:true});
wrap.addEventListener('touchmove', (e) => {
  const rect = wrap.getBoundingClientRect();
  if(e.touches.length === 1 && dragging){
    tx += e.touches[0].clientX - lastX; ty += e.touches[0].clientY - lastY;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    applyTransform();
  } else if(e.touches.length === 2){
    const dist = touchDist(e.touches);
    const mid = touchMid(e.touches);
    const factor = dist / lastTouchDist;
    zoomBy(factor, mid.x - rect.left, mid.y - rect.top);
    lastTouchDist = dist; lastTouchMid = mid;
  }
}, {passive:true});
wrap.addEventListener('touchend', () => { dragging = false; lastTouchDist = null; });
function touchDist(t){ return Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY); }
function touchMid(t){ return {x:(t[0].clientX+t[1].clientX)/2, y:(t[0].clientY+t[1].clientY)/2}; }

</script>
